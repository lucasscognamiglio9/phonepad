build:
  name: Phonepad personal — unsigned iPhone Release
  steps:
    - eas/checkout
    - eas/install_node_modules
    - run:
        name: Check the app
        command: |
          npm run typecheck
          npm test
          python3 -m unittest discover -s tests -p '*_test.py'
    - run:
        name: Build for a real iPhone without Apple signing credentials
        id: archive
        outputs: [ipa_path]
        command: |
          bash scripts/build-ios-personal.sh
          test -s "$PWD/build/Phonepad-unsigned.ipa"
          set-output ipa_path "$PWD/build/Phonepad-unsigned.ipa"
    - eas/upload_artifact:
        name: IPA for local signing with iloader (not a TestFlight build)
        inputs:
          type: application-archive
          path: ${ steps.archive.ipa_path }
