name: Unsigned iPhone build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phonepad-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install locked dependencies
        working-directory: mobile
        run: npm ci
      - name: Build and verify unsigned iPhone archive
        working-directory: mobile
        run: bash scripts/build-ios-personal.sh
      - name: Record package checksum
        working-directory: mobile/build
        run: shasum -a 256 Phonepad-unsigned.ipa > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Phonepad-iPhone-unsigned
          path: |
            mobile/build/Phonepad-unsigned.ipa
            mobile/build/SHA256SUMS.txt
            mobile/build/iphone-build-verification.json
          retention-days: 14
